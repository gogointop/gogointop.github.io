<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>瘋狗野球 打擊練習</title>
<meta name="description" content="你當打者，電腦投手照配球秘笈配球。鎖球種、抓時間點，每一球都告訴你投手接下來會怎麼想。">
<meta property="og:type" content="website">
<meta property="og:site_name" content="瘋狗野球">
<meta property="og:title" content="瘋狗野球 打擊練習">
<meta property="og:description" content="你當打者，電腦投手照配球秘笈配球。鎖球種、抓時間點，每一球都告訴你投手接下來會怎麼想。">
<meta property="og:url" content="https://gogointop.github.io/batter-practice/">
<meta property="og:image" content="https://gogointop.github.io/batter-practice/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0d1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="打擊練習">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --bg:#0d1117; --card:#161b22; --card2:#1c2330; --line:#30363d;
  --text:#e6edf3; --muted:#9aa4b0; --accent:#f2cc60;
  --cue:#58a6ff; --read:#e3b341; --next:#3fb950; --danger:#f85149;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:18px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  line-height:1.55;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p{margin:0}

/* 頂部 */
header{position:sticky;top:0;z-index:5;background:rgba(13,17,23,.96);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 14px 10px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:1.1rem;min-height:36px}
.brand .back{background:none;border:0;font-size:1.3rem;padding:4px 10px 4px 0;min-height:44px}
.tools{padding:10px 14px 4px;max-width:720px;margin:0 auto}
.search{position:relative}
.search input{width:100%;height:50px;border-radius:12px;border:1px solid var(--line);background:var(--card);
  padding:0 46px 0 14px;font-size:1rem;outline:none}
.search input:focus{border-color:var(--accent)}
.search button{position:absolute;right:2px;top:2px;width:46px;height:46px;border:0;background:none;color:var(--muted);font-size:1.2rem}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;min-width:58px;height:46px;padding:0 14px;border-radius:23px;border:1px solid var(--line);
  background:var(--card);font-weight:700;font-variant-numeric:tabular-nums}
.chip.on{background:var(--accent);border-color:var(--accent);color:#111}
.pov{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:.85rem;color:var(--muted)}
.pov select{flex:1;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--card);padding:0 10px;color:var(--text)}

main{padding:14px;max-width:720px;margin:0 auto}
.muted{color:var(--muted)} .small{font-size:.82rem}
.sec{font-size:.85rem;color:var(--muted);font-weight:700;margin:18px 2px 8px;letter-spacing:.05em}

/* 首頁章節卡 */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chap{display:flex;flex-direction:column;justify-content:space-between;text-align:left;min-height:128px;
  padding:14px;border-radius:16px;border:1px solid var(--line);background:var(--card)}
.chap:active{background:var(--card2)}
.chap .id{font-size:1.7rem;font-weight:800;color:var(--accent);line-height:1}
.chap .t{font-weight:700;font-size:1.02rem;margin-top:8px}
.chap .n{font-size:.8rem;color:var(--muted);margin-top:6px}
.chap.pending{opacity:.45;border-style:dashed}
.chap.pending .id{color:var(--muted)}

/* 核心原則 */
.principle{border:1px solid var(--accent);background:rgba(242,204,96,.09);border-radius:14px;padding:12px 14px;margin-bottom:14px}
.principle b{display:block;color:var(--accent);font-size:.8rem;margin-bottom:2px}

/* 手風琴 */
details.item{border:1px solid var(--line);border-radius:14px;background:var(--card);margin-bottom:10px;overflow:hidden}
details.item>summary{list-style:none;display:flex;align-items:center;gap:10px;min-height:60px;padding:10px 14px;font-weight:700;cursor:pointer}
details.item>summary::-webkit-details-marker{display:none}
details.item>summary::before{content:"▸";color:var(--muted);transition:transform .15s;flex:0 0 auto}
details.item[open]>summary::before{transform:rotate(90deg)}
details.item>summary .tt{flex:1}
.badge{flex:0 0 auto;font-size:.75rem;font-weight:700;padding:2px 8px;border-radius:10px;border:1px solid var(--line);color:var(--accent);font-variant-numeric:tabular-nums}
.body{padding:2px 14px 14px}
.part{border-left:4px solid;padding:6px 0 6px 12px;margin-top:10px}
.part .lab{font-size:.78rem;font-weight:800;letter-spacing:.06em}
.part.cue{border-color:var(--cue)} .part.cue .lab{color:var(--cue)}
.part.read{border-color:var(--read)} .part.read .lab{color:var(--read)}
.part.next{border-color:var(--next);background:rgba(63,185,80,.08);border-radius:0 10px 10px 0;padding-right:10px}
.part.next .lab{color:var(--next)}
.part.next .txt{font-size:1.1rem;font-weight:700}
.part ul{margin:6px 0 0;padding-left:1.1em}
.part li{margin-top:2px}
.mine{margin-top:10px;padding:8px 12px;border-radius:10px;background:var(--card2);font-size:.9rem}
.mine b{color:var(--accent)}
mark{background:var(--accent);color:#111;border-radius:3px;padding:0 1px}
.empty{text-align:center;color:var(--muted);padding:36px 10px}

/* 清單與表單 */
.row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;min-height:64px;padding:12px 14px;margin-bottom:10px;
  border-radius:14px;border:1px solid var(--line);background:var(--card)}
.row .no{flex:0 0 auto;min-width:44px;text-align:center;font-weight:800;color:var(--accent);font-size:1.15rem}
.row .mid{flex:1;min-width:0}
.row .sub{font-size:.82rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{display:block;width:100%;min-height:54px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-weight:700;margin-bottom:10px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#111}
.btn.danger{color:var(--danger);border-color:#5a2a2a;background:none}
label.f{display:block;font-size:.8rem;color:var(--muted);margin:12px 0 4px}
.in{width:100%;height:50px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:0 12px;outline:none}
textarea.in{height:auto;min-height:96px;padding:10px 12px;line-height:1.5}
.in:focus{border-color:var(--accent)}
.two{display:flex;gap:10px}.two>*{flex:1;min-width:0}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{flex:1;height:48px;min-width:48px;border:0;background:var(--card);font-weight:700;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent);color:#111}
.prow{display:flex;gap:6px;align-items:center;margin-bottom:8px}
.prow select{flex:1;min-width:0;height:50px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:0 8px}
.prow input{width:74px;height:50px;border-radius:12px;border:1px solid var(--line);background:var(--card);text-align:center;padding:0 4px}
.ic{flex:0 0 auto;width:48px;height:50px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:1.1rem}
.ic.on{background:var(--accent);border-color:var(--accent);color:#111}
.bat{border:1px solid var(--line);border-radius:14px;background:var(--card);padding:10px;margin-bottom:10px}
.bat .top{display:flex;gap:8px;align-items:center}
.bat .top input{width:70px;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--bg);text-align:center;font-weight:800;color:var(--accent)}
.bat .top .seg{flex:1}
.bat .note{margin-top:8px;height:44px;background:var(--bg)}
.tag{display:inline-block;font-size:.78rem;padding:1px 8px;border-radius:9px;border:1px solid var(--line);margin:2px 4px 0 0}
.tag.k{border-color:var(--accent);color:var(--accent)}
ol.steps{padding-left:1.3em;margin:6px 0 0}
ol.steps li{margin-bottom:4px}

/* 練習 */
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tgrid button{min-height:50px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:.9rem;padding:4px}
.tgrid button.on{background:var(--accent);border-color:var(--accent);color:#111}
.tgrid.pt{margin:12px 0}
.btn:disabled{opacity:.45}
.sb{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.sb .cnt{display:flex;align-items:center;gap:5px;font-weight:800}
.sb .cnt span{margin-left:6px;color:var(--muted);font-size:.85rem}
.sb .cnt i{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);display:inline-block}
.sb .cnt i.b{background:var(--next);border-color:var(--next)} .sb .cnt i.s{background:var(--accent);border-color:var(--accent)}
.sb .who{flex:1;text-align:right;font-size:.85rem;color:var(--muted)}
.sb button{height:40px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:none;color:var(--muted);font-size:.8rem}
.fb{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:.92rem}
.fb .cue1{color:var(--cue);font-weight:700;margin-top:2px}
.fb .cue1:first-child{margin-top:0}
.ev{margin-top:2px}.ev.g2{color:var(--next)}.ev.g1{color:var(--read)}.ev.g0{color:var(--danger)}
.adv{border:1px solid var(--next);background:rgba(63,185,80,.08);border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:.92rem}
.adv .lab{color:var(--next);font-weight:800;font-size:.8rem;margin-bottom:2px}
.adv .k{display:inline-block;min-width:2.6em;color:var(--muted);font-size:.78rem;margin-right:6px}
.field{display:flex;align-items:center;justify-content:center;gap:6px;margin:6px 0}
.bt{width:54px;flex:0 0 auto;stroke:var(--muted);stroke-width:5;stroke-linecap:round;fill:none}
.bt circle{fill:var(--muted);stroke:none}
.bt .bat{stroke:var(--accent);stroke-width:6;transform-origin:46px 54px}
.bt .bat.swing{animation:sw .45s ease-out}
.bt.l{transform:scaleX(-1)}
@keyframes sw{0%{transform:rotate(0)}55%{transform:rotate(125deg)}100%{transform:rotate(0)}}
.zone{display:grid;grid-template-columns:repeat(5,52px);grid-auto-rows:52px;gap:3px}
.zone button{border-radius:8px;border:1px solid #56627a;background:#2c3646;font-weight:800;font-size:.8rem;color:#111;padding:0}
.zone button:active{filter:brightness(1.4)}
.zone button.z{background:#3d4a5f;border:2px solid #8b99ad}
.zone button.sel{outline:3px solid var(--accent);outline-offset:-1px;background:rgba(242,204,96,.25)}
.zone button[class*="r-"]{color:#111}
.zone .r-swstr,.zone .r-called{background:var(--accent)!important}
.zone .r-foul{background:#b9a56a!important}
.zone .r-ball{background:var(--next)!important}
.zone .r-hit{background:var(--danger)!important}
.zone .r-out{background:var(--cue)!important}
b.r-swstr,b.r-called,b.r-foul{color:var(--accent)} b.r-ball{color:var(--next)} b.r-hit{color:var(--danger)} b.r-out{color:var(--cue)}
.zl{display:flex;justify-content:space-between;font-size:.68rem;color:var(--muted);margin-top:3px}
.miss{color:#f0883e;font-weight:700}
.tcard{border:2px solid var(--accent);border-radius:16px;padding:14px;background:linear-gradient(160deg,rgba(242,204,96,.12),var(--card) 60%)}
.tc-top{display:flex;align-items:center;gap:14px}
.tcard .ti{font-size:3rem;line-height:1}
.tcard .tl{font-size:.75rem;color:var(--muted);font-weight:700}
.tcard .tn{font-size:1.5rem;font-weight:900;color:var(--accent)}
.tcard .td{font-size:.85rem;color:var(--muted)}
.tstats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0 6px;text-align:center;font-size:.72rem;color:var(--muted)}
.tstats b{display:block;font-size:1.1rem;color:var(--text)}
.trow{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--card);margin-bottom:8px}
.trow .ti{font-size:2rem;flex:0 0 44px;text-align:center}
.trow.locked{opacity:.55}
.trow.cur{border-color:var(--accent)}
.unlock{display:flex;gap:12px;align-items:center;border:2px solid var(--accent);background:rgba(242,204,96,.15);border-radius:14px;padding:10px 14px;margin-bottom:10px;animation:pop .5s ease-out}
.unlock span{font-size:2.2rem}
@keyframes pop{0%{transform:scale(.85);opacity:0}100%{transform:scale(1);opacity:1}}
.rv{border-bottom:1px solid var(--line);padding:8px 2px}

/* 底部分頁 */
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:rgba(22,27,34,.98);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)}
nav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;height:64px;text-decoration:none;color:var(--muted);font-size:.72rem;font-weight:700;gap:2px}
nav a span{font-size:1.35rem;line-height:1}
nav a.on{color:var(--accent)}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#e6edf3;color:#111;
  padding:8px 16px;border-radius:20px;font-size:.9rem;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9;max-width:90vw}
#toast.show{opacity:1}
</style>
<style>
.arsenal{font-size:.8rem;color:var(--muted);margin:-4px 0 8px}
.guess{display:grid;grid-template-columns:auto 1fr;gap:6px 8px;align-items:center;margin:8px 0}
.guess .gl{font-size:.78rem;color:var(--muted);font-weight:700}
.guess .seg button{height:42px;font-size:.9rem}
.stage{position:relative;display:flex;justify-content:center;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#cv{width:340px;height:400px;border-radius:16px;border:1px solid var(--line);max-width:100%}
#flash{position:absolute;top:150px;left:0;right:0;text-align:center;font-size:1.6rem;font-weight:900;color:var(--accent);opacity:0;transition:opacity .15s;pointer-events:none;text-shadow:0 2px 8px #000}
#flash.show{opacity:1}
.btn.big{min-height:76px;font-size:1.35rem;margin-top:10px;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.btn.swing{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.swing.hit{filter:brightness(.7)}
.mini{margin-left:8px;height:32px;padding:0 10px;border-radius:8px;border:1px solid var(--next);background:none;color:var(--next);font-weight:700;font-size:.8rem}
.stats4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;font-size:.72rem;color:var(--muted);margin:10px 0}
.stats4 b{display:block;font-size:1.15rem;color:var(--text)}
b.r-hit{color:var(--danger)}
body{padding-bottom:calc(24px + env(safe-area-inset-bottom))}
</style>
</head>
<body>
<header><div class="brand"><span id="title">瘋狗野球 打擊練習</span></div></header>
<main id="view"></main>
<div id="toast"></div>
<script>
/* ===== 共用資料：複製自配球練習（pitch-handbook），兩邊各自獨立 ===== */
const DATA = [
  { id:"A", title:"淺球數開局",
    principle:"淺球數不是搶數量優勢，是製造資訊不對稱。",
    items:[
      { t:"0-0 第一球：建立資料", counts:["0-0"],
        cue:"打席第一球，雙方都還沒有情報",
        read:"這球價值在情報，不在搶好球",
        next:"給邊角好球，不要中間直球",
        branch:["打了 → 拿到他對邊角的反應","看了 → 免費好球＋選球範圍資訊"] },
      { t:"1-0 壞球後：打者進入找球狀態", counts:["1-0"], want:["breaking","offspeed"],
        cue:"第一球壞球，打者開始找球打",
        read:"注意力鎖在剛剛壞球的位置／球種附近，保護模式還沒啟動",
        next:"給反方向（內角換外角）、同速度帶的球，製造位置差",
        branch:["適合用變化球騙揮空"] },
      { t:"0-1 好球後：打者開始縮小範圍", counts:["0-1"],
        cue:"第一球好球，打者開始縮小範圍",
        read:"他會排除「剛剛那顆應該不會再來」的選項",
        next:"同球種、同位置再來一次",
        branch:["怕太明顯 → 同位置不同球種，利用視覺殘留造成時間誤差"] }
    ]},
  { id:"B", title:"1-1 之後的讀心階段",
    principle:"每一球都在打者的「記憶」上做文章，利用或打破他記得、信任、排除的東西。",
    items:[
      { t:"打者的腦內劇本", counts:["1-1"],
        cue:"他已看過兩球：球種順序、位置變化，加上對你配球習慣的印象",
        read:"他正依這些線索推演下一球的劇本",
        next:"製造劇本裡沒有的選項",
        branch:["最有效：換「節奏」","或「同球種、不同層級的位置」","不一定要換球種"] },
      { t:"打法 A：誘導出棒", counts:["1-1"], want:["breaking","fast"],
        cue:"想確認他的出棒 timing",
        read:"出手點與前面好球一致，差異只在最後 20 公分，他很難及時分辨",
        next:"給看起來像好球、但會出去的球",
        branch:["外角滑球外飄","內角速球內偏"] },
      { t:"打法 B：再進攻好球帶", counts:["1-1"],
        cue:"前兩球他都沒揮棒",
        read:"可能在等好球",
        next:"再塞一顆好球，測試他的耐心極限" },
      { t:"1-2：誘餌球", counts:["1-2"],
        cue:"球數 1-2",
        read:"資訊最不對稱的時刻：你有容錯，他沒有",
        next:"沿用前面出現過的球種／位置，加大偏移量",
        branch:["例：內角好球邊緣，再往內一點變壞球","打者因為記憶，更容易出棒"] }
    ]},
  { id:"C", title:"揮棒後的反應線索",
    items:[
      { group:"揮空殘影", t:"揮棒偏高、偏前", want:["offspeed","breaking"],
        cue:"揮空，棒子偏高、偏前",
        read:"他預期的是速球",
        next:"變速球或滑球，騙時間差" },
      { group:"揮空殘影", t:"揮棒拖很後面", want:["fast"],
        cue:"揮空，揮棒拖很後面",
        read:"在等變化球，但球速沒抓準",
        next:"回速球，打時間差" },
      { group:"揮空殘影", t:"重心整個前倒", want:["breaking"],
        cue:"揮空，重心整個前倒",
        read:"被外角變化球騙到",
        next:"同方向、同位置再來一次" },
      { group:"揮空後眼神／頭部", t:"頭轉向追球",
        cue:"揮空後頭轉向追球",
        read:"看到了但反應慢，問題在球速",

      g.coldSeen = quad(last);

  const last = g.pitches[g.pitches.length - 1], hints = store.play.hints, a = g.advice, rd = readPitcher(a);
  const resTxt = p => p.res === "hit" ? HIT[p.hit] : RES[p.res];
  const fb = last ? `<div class="fb"><div><span class="muted">第 ${last.n} 球</span> <b>${esc(last.type)} ${last.kmh}</b>・${locName(last)} → <b class="r-${last.res}">${resTxt(last)}</b></div>
      <div class="cue1">${BCUE[last.cue]}</div>
      ${last.miss ? `<div class="small miss">投手失投：他瞄的是${esc(last.miss)}</div>` : ""}
      <div class="ev g${Math.round(last.grade)}">${last.notes.map(esc).join("；")}</div></div>` : "";
  const hint = hints ? `<div class="adv"><div class="lab">🧠 ${last ? "投手接下來可能這樣想" : "第一球，投手可能這樣想"}</div>
      <div><span class="k">秘笈</span>${esc(a.it.t)}：${esc(a.it.next)}</div>
      <div><span class="k">可能</span>${esc(adviceTypes(a))}・${esc(a.loc)}</div>
      <div><span class="k">建議</span>${rd.type === "any" && rd.side === "any" ? "不用鎖，看到好球就打" : `鎖 <b>${TYPE_GUESS[rd.type]}</b>・<b>${SIDE_GUESS[rd.side]}</b>`}
        <button class="mini" data-b="useHint" data-t="${rd.type}" data-s="${rd.side}">照這樣鎖</button></div>
      ${g.level === "pain" ? `<div class="small muted">痛苦投手會在你猜中後故意換球</div>` : ""}</div>` : "";
  const btn = { ready:"準備好了，投！", windup:"揮棒！", flying:"揮棒！", result:"下一球", "done-wait":"看檢討", "result-end":"看檢討" }[g.phase];
  return `<div class="sb"><div class="cnt"><span>B</span>${dots(g.b, 3, "b")}<span>S</span>${dots(g.s, 2, "s")}</div>
      <div class="who">${LEVELS[g.level]}・${g.phand === "R" ? "右投" : "左投"}${SLOTS[g.slot]}・${g.styleName}</div><button data-b="quit">放棄</button></div>
    <div class="arsenal">他的球種：${store.play.types.map(t => `${esc(t)} ${kmhOf(t)}`).join("・")}</div>
    ${g.phase === "ready" ? fb + hint : g.end ? fb : ""}
    <div class="guess"><div class="gl">鎖球種</div>${seg("gtype", g.guess.type, Object.entries(TYPE_GUESS))}
      <div class="gl">鎖區域</div>${seg("gside", g.guess.side, Object.entries(SIDE_GUESS))}</div>
    <div class="stage"><canvas id="cv"></canvas><div id="flash"></div></div>
    <button class="btn pri big${g.phase === "windup" || g.phase === "flying" ? " swing" : ""}" id="act">${btn}</button>
    ${store.play.assist ? `<p class="muted small" style="text-align:center;margin-top:6px">外圈縮到貼住球、上方的白點走到黃線時按揮棒（綠色＝好時機）</p>` : ""}`;
}
function viewDone(){
  const P = g.pitches, sc = scoreOf(g), last = P[P.length - 1];
  const out = { b1:"一壘安打", b2:"二壘安打", hr:"全壘打！", bb:"保送", k:"三振", out:"出局" }[g.end];
  const good = ["b1", "b2", "hr", "bb"].includes(g.end);
  const dec = P.filter(p => p.grade >= 1).length, locked = P.filter(p => p.typeHit !== null), hitG = locked.filter(p => p.typeHit).length;
  const sw = P.filter(p => p.swung && p.err !== null), avgErr = sw.length ? sw.reduce((a, p) => a + Math.abs(p.err), 0) / sw.length : null;
  const chase = P.filter(p => p.swung && !inZ(p) && p.grade < 1).length, frozen = P.filter(p => !p.swung && inZ(p) && p.grade < 1).length;
  const follow = P.filter(p => p.follow).length;
  const fastN = P.filter(p => isFast(p.type)).length;
  const tips = [];
  if (chase) tips.push(`追了 ${chase} 顆壞球：兩好球前，邊角外的球放掉`);
  if (frozen) tips.push(`有 ${frozen} 顆好球沒揮：該出棒時要果斷，尤其兩好球後`);
  if (locked.length && hitG / locked.length < .5) tips.push("鎖球種的命中率不到一半：多看「投手可能這樣想」，用球數和上一球推他的下一球");
  if (!locked.length) tips.push("這個打席都沒鎖球種：猜中時時間點的容錯會變大，試著依球數鎖一類球");
  if (avgErr !== null && avgErr > 120) tips.push(`出棒平均誤差 ${(avgErr / 1000).toFixed(2)} 秒：先鎖一類球，專心抓那個速度`);
  if (!tips.length) tips.push("選球和預判都不錯，換更高難度挑戰");
  return `<div class="principle"><b>打席結果（${LEVELS[g.level]}）</b><span style="font-size:1.3rem;font-weight:900">${out}</span>　策略分 <b>${sc}</b>
      <div class="small" style="margin-top:4px">${BCUE[last.cue]}${sc >= 75 && !good ? "<br>策略是對的，結果不好是機率。" : sc < 50 && good ? "<br>結果是好的，但過程有點靠運氣。" : ""}</div></div>
    <div class="stats4"><div><b>${Math.round(dec / P.length * 100)}%</b>選球正確</div><div><b>${locked.length ? Math.round(hitG / locked.length * 100) + "%" : "-"}</b>猜中球種</div>
      <div><b>${avgErr === null ? "-" : (avgErr / 1000).toFixed(2) + "s"}</b>出棒誤差</div><div><b>${P.length}</b>球數</div></div>
    <div class="sec">逐球檢討</div>
    ${P.map(p => `<div class="rv"><div><b>${p.n}.</b> <span class="muted">${p.b}-${p.s}</span> ${esc(p.type)} ${p.kmh}・${locName(p)} → <b class="r-${p.res}">${p.res === "hit" ? HIT[p.hit] : RES[p.res]}</b></div>
      <div class="small muted">你：${p.guess.type === "any" && p.guess.side === "any" ? "沒鎖" : "鎖" + (p.guess.type === "any" ? "" : TYPE_GUESS[p.guess.type]) + (p.guess.type !== "any" && p.guess.side !== "any" ? "・" : "") + (p.guess.side === "any" ? "" : SIDE_GUESS[p.guess.side])}，${p.swung ? (p.err === null ? "揮棒" : `揮棒（${p.err < 0 ? "早" : "晚"} ${(Math.abs(p.err) / 1000).toFixed(2)}s）`) : "沒揮"}${p.miss ? "・投手失投" : ""}${p.follow ? "" : "・這球他沒照書"}</div>
      <div class="small ev g${Math.round(p.grade)}">${p.notes.map(esc).join("；")}</div></div>`).join("")}
    <div class="sec">這個投手</div>
    <div class="adv"><div>・${P.length} 球裡有 ${follow} 球照秘笈配${g.level === "am" ? "，業餘投手常常想到什麼投什麼" : ""}</div>
      <div>・速球 ${fastN} 球、變化球 ${P.length - fastN} 球</div></div>
    <div class="sec">下次可以這樣打</div>
    <div class="adv">${tips.map(t => `<div>・${esc(t)}</div>`).join("")}</div>
    <button class="btn pri" style="margin-top:16px" data-b="start">再來一個打席</button>
    <button class="btn" data-b="setup">換設定</button>`;
}

/* ---------- 投球動畫 ---------- */
const CV = { W:340, H:400, cell:46, gap:3 };
function geom(){
  const gw = CV.cell * 5 + CV.gap * 4, gx = (CV.W - gw) / 2, gy = CV.H - gw - 34;
  return { gw, gx, gy };
}
function cellCenter(c){
  const { gx, gy } = geom(), col = store.play.bhand === "R" ? c.x : 4 - c.x;
  return { x: gx + col * (CV.cell + CV.gap) + CV.cell / 2, y: gy + c.y * (CV.cell + CV.gap) + CV.cell / 2 };
}
function release(){
  const off = { over:8, tq:28, side:58, sub:70 }[g.slot], ht = { over:42, tq:52, side:74, sub:102 }[g.slot];
  return { x: CV.W / 2 + (g.phand === "R" ? -off : off), y: ht };
}
let anim = null;
function drawScene(ball){
  const cv = $("#cv"); if (!cv) return;
  const dpr = window.devicePixelRatio || 1;
  if (cv.width !== CV.W * dpr) { cv.width = CV.W * dpr; cv.height = CV.H * dpr; }
  const x = cv.getContext("2d"); x.setTransform(dpr, 0, 0, dpr, 0, 0);
  const gr = x.createLinearGradient(0, 0, 0, CV.H); gr.addColorStop(0, "#14301f"); gr.addColorStop(.45, "#0f1a14"); gr.addColorStop(1, "#0d1117");
  x.fillStyle = gr; x.fillRect(0, 0, CV.W, CV.H);
  /* 投手丘與投手 */
  x.fillStyle = "#5a4630"; x.beginPath(); x.ellipse(CV.W / 2, 104, 70, 16, 0, 0, Math.PI * 2); x.fill();
  const r = release(), side = g.phand === "R" ? -1 : 1;
  x.strokeStyle = "#c9d1d9"; x.lineWidth = 4; x.lineCap = "round";
  x.beginPath(); x.moveTo(CV.W / 2, 62); x.lineTo(CV.W / 2, 92); x.moveTo(CV.W / 2, 92); x.lineTo(CV.W / 2 - 9, 106); x.moveTo(CV.W / 2, 92); x.lineTo(CV.W / 2 + 9, 106);
  x.moveTo(CV.W / 2, 70); x.lineTo(r.x, r.y); x.stroke();
  x.fillStyle = "#c9d1d9"; x.beginPath(); x.arc(CV.W / 2, 54, 7, 0, Math.PI * 2); x.fill();
  /* 好球帶 */
  const { gx, gy, gw } = geom();
  for (let yy = 0; yy < 5; yy++) for (let xx = 0; xx < 5; xx++) {
    const z = xx >= 1 && xx <= 3 && yy >= 1 && yy <= 3, px = gx + xx * (CV.cell + CV.gap), py = gy + yy * (CV.cell + CV.gap);
    x.fillStyle = z ? "rgba(61,74,95,.55)" : "rgba(44,54,70,.35)"; x.strokeStyle = z ? "rgba(139,153,173,.8)" : "rgba(86,98,122,.5)"; x.lineWidth = z ? 2 : 1;
    x.beginPath(); x.roundRect ? x.roundRect(px, py, CV.cell, CV.cell, 7) : x.rect(px, py, CV.cell, CV.cell); x.fill(); x.stroke();
  }
  x.fillStyle = "#9aa4b0"; x.font = "12px sans-serif"; x.textAlign = "left";
  const inL = store.play.bhand === "R";
  x.fillText(inL ? "← 內角" : "← 外角", gx, gy + gw + 18); x.textAlign = "right"; x.fillText(inL ? "外角 →" : "內角 →", gx + gw, gy + gw + 18);
  x.textAlign = "center"; x.fillText("捕手視角", CV.W / 2, gy + gw + 18);
  /* 已經投過的球 */
  for (const p of g.pitches) {
    const c = cellCenter(p), cur = p === g.pitches[g.pitches.length - 1] && g.phase !== "windup" && g.phase !== "flying";
    x.globalAlpha = cur ? 1 : .45; x.fillStyle = cur ? "#ffffff" : "#9aa4b0";
    x.beginPath(); x.arc(c.x, c.y, cur ? 12 : 9, 0, Math.PI * 2); x.fill();
    x.fillStyle = "#111"; x.font = "bold 11px sans-serif"; x.fillText(p.n, c.x, c.y + 4); x.globalAlpha = 1;
  }
  if (ball) {
    x.fillStyle = "rgba(0,0,0,.35)"; x.beginPath(); x.ellipse(ball.x + ball.r * .3, ball.y + ball.r * .5, ball.r, ball.r * .5, 0, 0, Math.PI * 2); x.fill();
    x.fillStyle = "#f4f1e8"; x.beginPath(); x.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2); x.fill();
    x.strokeStyle = "#d63b3b"; x.lineWidth = Math.max(1, ball.r / 6); x.beginPath(); x.arc(ball.x - ball.r * .9, ball.y, ball.r * .7, -.9, .9); x.stroke();
    x.beginPath(); x.arc(ball.x + ball.r * .9, ball.y, ball.r * .7, Math.PI - .9, Math.PI + .9); x.stroke();
  }
  if (store.play.assist && (g.phase === "flying" || g.phase === "windup")) {
    const x0 = 34, x1 = CV.W - 34, hitX = x0 + (x1 - x0) * .8, yb = 18;
    const win = goodWindow(), dur = g.dur || LV[g.level].D * phy(g.plan.type).dur;
    const band = (win / dur) * (hitX - x0);
    x.fillStyle = "rgba(255,255,255,.12)"; x.fillRect(x0, yb - 4, x1 - x0, 8);
    x.fillStyle = "rgba(63,185,80,.55)"; x.fillRect(hitX - band, yb - 6, band * 2, 12);
    x.fillStyle = "#f2cc60"; x.fillRect(hitX - 1.5, yb - 10, 3, 20);
    x.fillStyle = "#9aa4b0"; x.font = "11px sans-serif"; x.textAlign = "center"; x.fillText("打擊點", hitX, yb + 22);
    if (g.phase === "flying") {
      const left = g.t0 + dur - performance.now(), f = 1 - left / dur;
      const mx = x0 + (hitX - x0) * f, good = Math.abs(left) <= win;
      x.fillStyle = good ? "#3fb950" : "#ffffff"; x.beginPath(); x.arc(Math.min(mx, x1), yb, good ? 8 : 6, 0, Math.PI * 2); x.fill();
      if (ball) {
        x.strokeStyle = good ? "#3fb950" : "rgba(255,255,255,.75)"; x.lineWidth = good ? 4 : 2.5;
        x.beginPath(); x.arc(ball.x, ball.y, ball.r + Math.max(0, left) / dur * 70 + 2, 0, Math.PI * 2); x.stroke();
      }
    }
  }
  if (g.phase === "windup") { x.fillStyle = "#f2cc60"; x.font = "bold 18px sans-serif"; x.textAlign = "center"; x.fillText("投手準備…", CV.W / 2, 150); }
}
function ballAt(p){
  const ph = phy(g.plan.type), r = release(), t = cellCenter(g.plan.cell), sideMul = g.phand === "R" ? 1 : -1;
  const hMul = g.low ? 1.3 : 1, vMul = g.low ? .6 : 1;
  const bx = ph.bx * sideMul * hMul, by = ph.by * vMul;
  const e = Math.pow(p, 1.35), late = Math.pow(p, 2.6);
  let X = r.x + (t.x - bx - r.x) * e + bx * late, Y = r.y + (t.y - by - r.y) * e + by * late;
  if (ph.arc) Y -= ph.arc * Math.sin(Math.PI * p) * (1 - p * .3);
  if (ph.wobble) X += Math.sin(p * 22) * 5 * p;
  return { x:X, y:Y, r:2 + 10 * p * p };
}
function pitchNow(){
  g.phase = "windup"; g.swingAt = null; render();
  $("#act").scrollIntoView({ block:"end", behavior:"instant" });
  const wait = 500 + Math.random() * 700;
  anim = setTimeout(() => {
    g.phase = "flying"; g.t0 = performance.now(); g.dur = LV[g.level].D * phy(g.plan.type).dur;
    const tick = now => {
      if (g.phase !== "flying") return;
      const p = (now - g.t0) / g.dur;
      if (p >= 1) { drawScene(ballAt(1)); if (g.swingAt === null) setTimeout(() => finish(), 260); else finish(); return; }
      drawScene(ballAt(p)); requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }, wait);
}
function swing(ts){
  if (g.phase === "windup") { flash("還沒出手！"); return; }
  if (g.phase !== "flying" || g.swingAt !== null) return;
  g.swingAt = ts;
  const err = ts - (g.t0 + g.dur);
  flash(Math.abs(err) <= 40 ? "完美！" : (err < 0 ? "早 " : "晚 ") + (Math.abs(err) / 1000).toFixed(2) + "s");
  $("#act")?.classList.add("hit");
  if (err > 0) finish();
}
function finish(){
  if (g.phase !== "flying") return;
  g.phase = "result";
  const err = g.swingAt === null ? null : g.swingAt - (g.t0 + g.dur);
  /* 球到之後太久才揮，算沒揮 */
  resolve(err !== null && err > 300 ? null : err);
  g.phase = g.end ? "done-wait" : "ready";
  if (g.end) { render(); drawScene(); const b = $("#act"); if (b) b.textContent = "看檢討"; g.phase = "result-end"; return; }
  render();
}
let flashT;
function flash(t){ const f = $("#flash"); if (!f) return; f.textContent = t; f.classList.add("show"); clearTimeout(flashT); flashT = setTimeout(() => f.classList.remove("show"), 700); }

/* ---------- 事件 ---------- */
document.addEventListener("pointerdown", e => {
  if (!g || view !== "live") return;
  const act = e.target.closest("#act"), stage = e.target.closest(".stage");
  if (!act && !stage) return;
  if (g.phase === "windup" || g.phase === "flying") { e.preventDefault(); g.swungClock = performance.now(); swing(g.swungClock); }
});
document.addEventListener("click", e => {
  const t = e.target.closest("[data-b], #act");
  if (!t) return;
  const p = store.play, v = t.dataset.v;
  if (t.id === "act") {
    /* 揮棒那一下的 click 不要被當成「下一球」 */
    if (g.swungClock && performance.now() - g.swungClock < 450) return;
    if (g.phase === "ready") pitchNow();
    else if (g.phase === "result-end") { g.phase = "done"; render(); window.scrollTo(0, 0); }
    return;
  }
  switch (t.dataset.b) {
    case "level": p.level = v; break;
    case "bhand": p.bhand = v; break;
    case "phandSel": p.phandSel = v; break;
    case "slot": p.slot = v; break;
    case "style": p.style = v; break;
    case "hints": p.hints = !!v; break;
    case "assist": p.assist = !!v; break;
    case "ctype": p.custom = p.custom.includes(v) ? p.custom.filter(x => x !== v) : PITCH_TYPES.map(x => x.name).filter(n => n === v || p.custom.includes(n)); break;
    case "start": save(); startPA(); view = "live"; render(); window.scrollTo(0, 0); return;
    case "setup": view = "setup"; g = null; render(); return;
    case "quit": if (g.pitches.length && !confirm("放棄這個打席？")) return; clearTimeout(anim); g = null; view = "setup"; render(); return;
    case "reset": e.preventDefault(); if (!confirm("戰績歸零？")) return; store.stats[p.level] = blankStats(); break;
    case "gtype": if (g.phase !== "ready") return; g.guess.type = v; render(); return;
    case "gside": if (g.phase !== "ready") return; g.guess.side = v; render(); return;
    case "useHint": g.guess.type = t.dataset.t; g.guess.side = t.dataset.s; render(); return;
    default: return;
  }
  save(); render();
});
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
render();

</script>
</body>
